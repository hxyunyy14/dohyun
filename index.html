<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 먹을 저녁 메뉴 추천 🍽️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        h1 {
            color: #2D3748;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .subtitle {
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .card {
            background: #FFF5F5;
            border: 2px dashed #FEB2B2;
            border-radius: 20px;
            padding: 35px 20px;
            margin-bottom: 30px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .emoji-box {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .emoji-box.bounce {
            animation: bounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounce {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.15); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        .menu-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: #C53030;
            margin-bottom: 6px;
            min-height: 2.2rem;
        }

        .menu-category {
            font-size: 0.85rem;
            color: #9B2C2C;
            background: #FED7D7;
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            font-weight: 600;
        }

        .btn {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            border: none;
            padding: 18px 36px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.35);
            transition: all 0.2s ease;
            width: 100%;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 107, 107, 0.45);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 6px 12px rgba(255, 107, 107, 0.25);
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #A0AEC0;
        }

        .history {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #4A5568;
            border-top: 1px solid #E2E8F0;
            padding-top: 15px;
            text-align: left;
        }

        .history-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #718096;
            display: flex;
            justify-content: space-between;
        }

        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .history-tag {
            background: #EDF2F7;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>오늘 뭐 먹지? 😋</h1>
        <p class="subtitle">고민되는 오늘 저녁, 메뉴를 추천해드릴게요!</p>

        <div class="card">
            <div id="emoji" class="emoji-box">❓</div>
            <div id="menu" class="menu-name">버튼을 눌러보세요!</div>
            <div id="category" class="menu-category" style="display: none;">카테고리</div>
        </div>

        <button class="btn" onclick="recommendMenu()">저녁 메뉴 추천 🎲</button>

        <div class="history" id="history-box" style="display: none;">
            <div class="history-title">
                <span>최근 추천 내역</span>
                <span id="count" style="font-size: 0.75rem; color: #CBD5E0;">0회 클릭</span>
            </div>
            <div class="history-tags" id="history-tags"></div>
        </div>

        <div class="footer">
            맛있는 한 끼 되세요!
        </div>
    </div>

    <script>
        const menuList = [
            // 한식
            { name: "김치찌개", emoji: "🍲", category: "한식" },
            { name: "된장찌개", emoji: "🥘", category: "한식" },
            { name: "삼겹살", emoji: "🥓", category: "한식" },
            { name: "비빔밥", emoji: "🥗", category: "한식" },
            { name: "불고기", emoji: "🥩", category: "한식" },
            { name: "떡볶이", emoji: "🍢", category: "한식" },
            { name: "국밥", emoji: "🥣", category: "한식" },
            
            // 일식
            { name: "초밥", emoji: "🍣", category: "일식" },
            { name: "라멘", emoji: "🍜", category: "일식" },
            { name: "돈가스", emoji: "🍱", category: "일식" },

            // 중식
            { name: "짜장면", emoji: "🍜", category: "중식" },
            { name: "짬뽕", emoji: "🍜", category: "중식" },
            { name: "마라탕", emoji: "🍲", category: "중식" },

            // 양식 & 기타
            { name: "피자", emoji: "🍕", category: "양식" },
            { name: "파스타", emoji: "🍝", category: "양식" },
            { name: "햄버거", emoji: "🍔", category: "양식" },
            { name: "치킨", emoji: "🍗", category: "야식/기타" },
            { name: "족발/보쌈", emoji: "🍖", category: "야식" }
        ];

        let clickCount = 0;
        let history = [];

        function recommendMenu() {
            const emojiEl = document.getElementById("emoji");
            const menuEl = document.getElementById("menu");
            const categoryEl = document.getElementById("category");
            const historyBox = document.getElementById("history-box");
            const historyTags = document.getElementById("history-tags");
            const countEl = document.getElementById("count");

            // 애니메이션 리셋
            emojiEl.classList.remove("bounce");

            // 빠른 랜더링 슬롯 효과
            let timer = setInterval(() => {
                const randomTemp = menuList[Math.floor(Math.random() * menuList.length)];
                emojiEl.textContent = randomTemp.emoji;
                menuEl.textContent = randomTemp.name;
            }, 50);

            setTimeout(() => {
                clearInterval(timer);

                // 최종 결정
                const randomIndex = Math.floor(Math.random() * menuList.length);
                const selected = menuList[randomIndex];

                emojiEl.textContent = selected.emoji;
                menuEl.textContent = selected.name;
                categoryEl.textContent = selected.category;
                categoryEl.style.display = "inline-block";

                // 애니메이션 재생
                void emojiEl.offsetWidth; 
                emojiEl.classList.add("bounce");

                // 내역 업데이트
                clickCount++;
                countEl.textContent = `${clickCount}번째 추천`;
                
                history.unshift(`${selected.emoji} ${selected.name}`);
                if (history.length > 5) history.pop();

                historyBox.style.display = "block";
                historyTags.innerHTML = history.map(item => `<span class="history-tag">${item}</span>`).join('');

            }, 400);
        }
    </script>
</body>
</html>
